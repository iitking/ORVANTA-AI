apiVersion: apps/v1
kind: Deployment
metadata:
  name: orvanta-backend
  labels:
    app: orvanta-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orvanta-backend
  template:
    metadata:
      labels:
        app: orvanta-backend
    spec:
      containers:
        - name: backend
          image: orvanta/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: orvanta-config
            - secretRef:
                name: orvanta-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orvanta-backend-service
spec:
  selector:
    app: orvanta-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
